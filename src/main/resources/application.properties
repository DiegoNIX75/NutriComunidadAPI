spring.application.name=nutricomunidad

# Carga opcional del archivo .env (formato propiedades) ubicado en la raíz del proyecto.
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL (Neon). Ejemplo: jdbc:postgresql://<host>.neon.tech/<base>?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

server.port=${PORT:8080}

jwt.secreto=${JWT_SECRET:}
jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}

app.cors.origenes=${CORS_ORIGENES:http://localhost:*}

# Administrador inicial (opcional). Si ambos valores existen y el correo no está registrado,
# se crea al iniciar la aplicación con el rol Administrador.
app.admin.correo=${ADMIN_CORREO:}
app.admin.contrasena=${ADMIN_PASSWORD:}
