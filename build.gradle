plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nutricomunidad'
version = '0.0.1-SNAPSHOT'
description = 'API REST de NutriComunidad'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // PostgreSQL embebido (binario real) para pruebas de integración y ejecución local sin Neon.
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Ejecuta la API con un PostgreSQL embebido (./gradlew bootTestRun), útil para probar sin Neon.
tasks.named('bootTestRun') {
    mainClass = 'com.nutricomunidad.NutriComunidadLocalApplication'
}
